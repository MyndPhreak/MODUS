# ─────────────────────────────────────────────────────────────────────────────
# MODUS — Lavalink v4 node configuration
#
# Consumed by the `lavalink` service in docker-compose.yml, which mounts this
# file read-only at /opt/Lavalink/application.yml. Upstream Lavalink 4.2.2 is
# used as-is (no MODUS fork); everything MODUS-specific lives in this file.
#
# Keys follow upstream's application.yml.example for 4.2.2. Environment
# variables override anything here (LAVALINK_SERVER_PASSWORD → the key below),
# so remote nodes can reuse this file verbatim.
# ─────────────────────────────────────────────────────────────────────────────

server: # REST and WS server
  port: 2333
  # Binds every interface *inside the container*. The Compose service never
  # publishes 2333 to the host — reach the node at http://lavalink:2333 over
  # the private `modus` network locally, and over Tailscale between hosts.
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  plugins:
    # The built-in YouTube source is deprecated upstream and no longer updated;
    # youtube-source replaces it. Pinned to a tagged release now that SABR +
    # PoToken support has shipped in one — bump this, the version referenced
    # in INSTALLATION.md, and the `clients:` list below together, since valid
    # client names change between builds. Check latest at
    # https://github.com/lavalink-devs/youtube-source/releases
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    # Unconfigured placeholder: no `plugins.lavasrc:` block below yet, so this
    # is inert until Spotify/Apple Music/etc. source credentials are wired up.
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      snapshot: false
  server:
    # Injected by Docker Compose from LAVALINK_SERVER_PASSWORD. Never write a
    # literal password here: this file is committed. The bot presents the same
    # value as a raw `Authorization: <password>` header (Lavalink v4 does not
    # use a `Bearer` prefix).
    password: "${LAVALINK_SERVER_PASSWORD}"
    sources:
      # Required to be false — the youtube-plugin above owns YouTube and will
      # not register if the built-in source is still enabled.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      # Off on purpose: the HTTP source would let any queued URL make the node
      # fetch arbitrary addresses it can reach, including other services on the
      # `modus` network. MODUS only resolves youtube / youtube-music /
      # soundcloud identifiers.
      http: false
      local: false
    filters: # MODUS persists saved filters per guild, so keep the full set
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    nonAllocatingFrameBuffer: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    # Player update cadence. MODUS reconciles positions from these frames after
    # a session resume, so keep it frequent enough to bound drift.
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    soundcloudFilterOutPreviewTracks: false
    gc-warnings: true
    # Note: no `ratelimit:`/`httpConfig:` blocks. MODUS does not rotate IP
    # blocks, route extraction through proxies, or otherwise evade platform
    # enforcement. Do not add them.
    # 10s, not the 3s these were: YouTube extraction routinely needs more than
    # three seconds, and a socket timeout that fires mid-extraction surfaces as
    # a track that simply fails to load. Matches the value running in production.
    timeouts:
      connectTimeoutMs: 10000
      connectionRequestTimeoutMs: 10000
      socketTimeoutMs: 10000

  # Session resuming has no server-side key in Lavalink v4 — the client opts in
  # per session over the REST API. MODUS deliberately does NOT: the adapter sets
  # `resume: false` (bot/music/LavalinkAdapter.ts), because a resumed socket was
  # being rejected by the node after a restart. Recovery is rebuilt from the
  # durable Postgres queue instead. Nothing to configure here; documented so the
  # absence is not mistaken for an oversight.

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    oauth:
      enabled: false   # flip to true once the aged account is ready to link
    # No `pot:` block here on purpose — none of the clients below (TV,
    # TVHTML5_SIMPLY, MWEB, ANDROID_VR) require a poToken; only WEB and
    # WEBEMBEDDED do, and neither is in the client list. If WEB goes back in,
    # supply the pair via PLUGINS_YOUTUBE_POT_TOKEN / PLUGINS_YOUTUBE_POT_VISITORDATA
    # in the environment (see docker-compose.yml and INSTALLATION.md → "Music
    # Relay") — never a literal here, since this file is committed.
    remoteCipher:
      # Signature deciphering is delegated to this third-party host, which puts
      # it in the critical path of every YouTube playback. Self-host
      # https://github.com/kikkia/yt-cipher and point this at it to drop the
      # external dependency. Set PLUGINS_YOUTUBE_REMOTECIPHER_PASSWORD if the
      # server you use requires one.
      url: "https://cipher.kikkia.dev/"
      userAgent: "modus-lavalink"
    # Verified against ClientProviderV4 at 1.18.2. The only valid names are
    # ANDROID, ANDROID_MUSIC, ANDROID_VR, IOS, MUSIC, TV, WEB, WEBEMBEDDED,
    # MWEB, TVHTML5_SIMPLY — anything else is not an error, it is logged as
    # "Failed to resolve … into a Client" and silently dropped. Order is
    # fallback order. Deliberately avoids WEB/WEBEMBEDDED/MUSIC so nothing
    # here needs a poToken; TV needs OAuth (see plugins.youtube.oauth above)
    # and covers sign-in-required playback once that's wired up.
    clients:
      - TV
      - TVHTML5_SIMPLY
      - MWEB
      - ANDROID_VR
  # No `lavalyrics:` plugin loaded — /lyrics always resolves via the LRCLIB
  # fallback in bot/music/lyrics.ts (LavalinkAdapter.getLyrics tries the node's
  # lyrics REST endpoint first, which 404s with no lavalyrics-plugin, then
  # falls through). Re-add com.github.topi314.lavalyrics:lavalyrics-plugin
  # above and a `lavalyrics.sources:` block here if that's not good enough.

metrics:
  prometheus:
    # Disabled by default: Prometheus Hotspot exports query Java's Cgroup MXBean
    # which crashes on Unraid / hybrid-cgroup Docker hosts. MODUS tracks its
    # own metrics via WebSocket stats frames and does not scrape this endpoint.
    enabled: false
    endpoint: /metrics

logging:
  # No `file.path`. The container has no volume for it, so a file appender would
  # write up to max-file-size × max-history into the container's writable layer
  # and lose it on every recreate. Logging to stdout puts it where the runtime
  # already collects it (`docker compose logs lavalink`).

  level:
    root: INFO
    lavalink: INFO

  request:
    # Off by default: MODUS drives one REST call per player mutation plus the
    # bot's reconnect probes, so this is steady noise that logs the caller's
    # address on every line. Turn it on temporarily when debugging the relay.
    enabled: false
    includeClientInfo: false
    # All three stay off: request headers carry the node password, and query
    # strings and payloads carry signed media URLs and encoded tracks. None of
    # that belongs in container logs or CI output.
    includeHeaders: false
    includeQueryString: false
    includePayload: false
    maxPayloadLength: 0
    beforeRequest: false
