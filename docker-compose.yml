# ─────────────────────────────────────────────────────────────────────────────
# MODUS — Docker Compose
# Runs both the Discord bot and the Nuxt web dashboard
# ─────────────────────────────────────────────────────────────────────────────
# Usage (build locally):
#   docker compose up -d --build     # build & start both services
#   docker compose logs -f           # tail all logs
#   docker compose down              # stop & remove containers
#
# Usage (pull from GHCR — for Unraid docker-compose plugin):
#   export GHCR_OWNER=myndphreak      # your GitHub username
#   docker compose pull
#   docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Redis (optional but recommended) ─────────────────────────────────────
  # Used by the bot for:
  #   - cross-shard cache invalidation (CacheService pub/sub)
  #   - leader election for background workers (RecordingRetentionWorker)
  #   - dashboard realtime SSE (log tail + config change events)
  # Set REDIS_URL=redis://redis:6379 in bot/.env and web/.env to use it.
  redis:
    image: redis:7-alpine
    container_name: modus-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - modus-redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - modus

  # ── Postgres (required) ──────────────────────────────────────────────────
  # The core database for MODUS (settings, recordings metadata, logs, etc.).
  postgres:
    image: postgres:16-alpine
    container_name: modus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modus}
      POSTGRES_USER: ${POSTGRES_USER:-modus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modus}
    volumes:
      - modus-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modus} -d ${POSTGRES_DB:-modus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - modus

  # ── Lavalink (music relay node) ──────────────────────────────────────────
  # Upstream Lavalink v4 + the youtube-source plugin, both pinned. MODUS owns
  # the canonical queue, leases, and recovery; this node only extracts,
  # decodes, filters, and streams audio into Discord voice.
  #
  # Deliberately NOT published to the host — 2333 is reachable only as
  # http://lavalink:2333 from the `modus` network (and over Tailscale between
  # hosts). Never map it to a public interface.
  #
  # Password wiring (the same value goes in two places, by design):
  #   - repo-root .env  → LAVALINK_SERVER_PASSWORD, which Compose injects here
  #   - bot/.env        → LAVALINK_SERVER_PASSWORD, which the bot substitutes
  #                       into LAVALINK_NODES_JSON
  # Generate with `openssl rand -hex 24`; see INSTALLATION.md. If it is unset
  # Compose warns and passes an empty value: Lavalink still starts, but treat
  # that as unconfigured, not as a working default.
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2-alpine
    container_name: modus-lavalink
    restart: unless-stopped
    environment:
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_SERVER_PASSWORD}
      # Heap ceiling. The default suits a handful of guilds; raise it for a
      # busy node (e.g. LAVALINK_JAVA_OPTIONS=-Xmx4G).
      - _JAVA_OPTIONS=${LAVALINK_JAVA_OPTIONS:--Xmx1G}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    expose:
      # Documentation only — other containers on `modus` can already reach it.
      - "2333"
    healthcheck:
      # Lavalink v4 auth is a raw `Authorization: <password>` header, with no
      # `Bearer` prefix. `$$` defers expansion to the container's shell so the
      # password never appears in `docker compose config` output.
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null --header \"Authorization: $$LAVALINK_SERVER_PASSWORD\" http://localhost:2333/version",
        ]
      interval: 30s
      timeout: 5s
      # First boot downloads the pinned plugin and warms the JVM.
      start_period: 120s
      retries: 5
    networks:
      - modus

  # ── Discord Bot ───────────────────────────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-local}/modus-bot:latest
    container_name: modus-bot
    restart: unless-stopped
    env_file: ./bot/.env
    ports:
      - "3005:3005"
    environment:
      - BOT_PORT=3005
    depends_on:
      # Startup ordering ONLY — never `condition: service_healthy`. Music is
      # one module among many: when the relay is missing or down the bot
      # answers music commands with MUSIC_RELAY_OFFLINE and keeps serving
      # tickets, moderation, and everything else. Gating bot startup on
      # Lavalink health would take the whole bot down with the node.
      lavalink:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http = require('http'); http.get('http://localhost:3005', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - modus

  # ── Web Dashboard (Nuxt) ─────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-local}/modus-web:latest
    container_name: modus-web
    restart: unless-stopped
    env_file: ./web/.env
    ports:
      - "3000:3000"
    environment:
      # Override bot URL to use the internal Docker network hostname
      - NUXT_PUBLIC_BOT_URL=http://bot:3005
    depends_on:
      bot:
        condition: service_healthy
    networks:
      - modus

networks:
  modus:
    driver: bridge

volumes:
  modus-pgdata:
    name: modus-pgdata
  modus-redisdata:
    name: modus-redisdata
