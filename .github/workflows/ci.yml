# ─────────────────────────────────────────────────────────────────────────────
# MODUS — Continuous Build on Push
#
# Selectively rebuilds only the service(s) that changed:
#   - bot/**  → ghcr.io/<owner>/modus-bot:<branch>        (all branches)
#               ghcr.io/<owner>/modus-bot:latest          (main only)
#   - web/**  → ghcr.io/<owner>/modus-web:<branch>        (all branches)
#               ghcr.io/<owner>/modus-web:latest          (main only)
#
# Also tags every build with :sha-<short-sha>. Can be triggered manually via
# workflow_dispatch. Versioned/tagged images are produced by
# docker-publish.yml when a release is merged.
# ─────────────────────────────────────────────────────────────────────────────

name: CI — Selective Build & Deploy

on:
  push:
    branches:
      - main
      - "**"
    paths:
      - "bot/**"
      - "web/**"
      - "lavalink/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io

jobs:
  # ── Keep third-party license notice up to date ─────────────────────────────
  check-licenses:
    name: Check Third-Party Licenses
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate third-party licenses
        run: pnpm run licenses:generate

      # Only push-events get an auto-fix commit — this runs on ubuntu-latest,
      # the same platform npm optional deps resolve for in Docker, so unlike
      # a local regenerate on macOS/Windows it can't introduce a platform-drift
      # diff. The commit only touches THIRD_PARTY_LICENSES.md, which isn't in
      # this workflow's path filter, so it can't retrigger this job.
      - name: Auto-commit regenerated licenses
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- THIRD_PARTY_LICENSES.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add THIRD_PARTY_LICENSES.md
            git commit -m "chore: auto-update THIRD_PARTY_LICENSES.md"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Fail if THIRD_PARTY_LICENSES.md is still out of date
        run: |
          if ! git diff --quiet -- THIRD_PARTY_LICENSES.md; then
            echo "::error file=THIRD_PARTY_LICENSES.md::THIRD_PARTY_LICENSES.md is out of date. Run 'pnpm run licenses:generate' and commit the result."
            git diff -- THIRD_PARTY_LICENSES.md
            exit 1
          fi

  # ── Detect which services changed ─────────────────────────────────────────
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      bot: ${{ steps.filter.outputs.bot }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect path changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            shared: &shared
              - "packages/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
            bot:
              - *shared
              - "bot/**"
              - "lavalink/**"
            web:
              - *shared
              - "web/**"

  # ── Validate the pinned Lavalink node boots (bot/** or lavalink/** changed) ─
  # Starts the exact image docker-compose.yml pins, with the exact
  # lavalink/application.yml this repo ships, and proves it answers an
  # authenticated /version with the YouTube plugin registered. Catches a bad
  # plugin coordinate, an unknown config key, or an image bump that no longer
  # boots — none of which the TypeScript tests can see, since they use fakes.
  lavalink-config:
    name: Validate Lavalink Config
    needs: changes
    if: ${{ needs.changes.outputs.bot == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Keep in lockstep with the `lavalink` service in docker-compose.yml;
      # the assertion below fails the job if the two ever drift apart.
      LAVALINK_IMAGE: ghcr.io/lavalink-devs/lavalink:4.2.2-alpine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assert the pinned image matches docker-compose.yml
        run: |
          grep -qF "image: $LAVALINK_IMAGE" docker-compose.yml

      # Throwaway, CI-local, and never a real deployment secret — it only has
      # to be present so the node's auth check accepts the health probe.
      # ::add-mask:: keeps it out of every subsequent log line.
      - name: Generate a throwaway node password
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "LAVALINK_SERVER_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Start Lavalink with the repository configuration
        run: |
          docker run -d --name lavalink-ci \
            -e LAVALINK_SERVER_PASSWORD \
            -e _JAVA_OPTIONS=-Xmx1G \
            -v "$PWD/lavalink/application.yml:/opt/Lavalink/application.yml:ro" \
            -p 127.0.0.1:2333:2333 \
            "$LAVALINK_IMAGE"

      # First boot downloads the pinned plugin from maven.lavalink.dev and
      # warms the JVM, so allow a generous window before failing.
      - name: Wait for an authenticated /version
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null \
              -H "Authorization: $LAVALINK_SERVER_PASSWORD" \
              http://127.0.0.1:2333/version; then
              echo "Lavalink answered /version after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Lavalink did not answer /version within 300s."
          exit 1

      - name: Assert the YouTube source is registered by the plugin
        run: |
          info="$(curl -fsS -H "Authorization: $LAVALINK_SERVER_PASSWORD" http://127.0.0.1:2333/v4/info)"
          if ! printf '%s' "$info" | grep -q '"youtube"'; then
            echo "::error::youtube-plugin did not register a youtube source manager."
            printf '%s\n' "$info"
            exit 1
          fi

      # Redacted twice over: application.yml already disables header/payload
      # request logging, and the password is masked and stripped here as well.
      - name: Print sanitized Lavalink logs
        if: failure()
        run: |
          docker logs lavalink-ci 2>&1 \
            | sed "s/$LAVALINK_SERVER_PASSWORD/***REDACTED***/g" \
            | tail -n 200

      - name: Stop and remove the Lavalink container
        if: always()
        run: docker rm -f lavalink-ci

  # ── Build Bot Image (only if bot/** changed, gated on lavalink-config) ────
  # Excludes automated release commits from Release Please to avoid duplicate
  # container builds, as docker-publish.yml handles release image publishing.
  build-bot:
    name: Build Bot Image
    needs: [changes, lavalink-config]
    if: >-
      needs.changes.outputs.bot == 'true' &&
      needs.lavalink-config.result == 'success' &&
      !startsWith(github.event.head_commit.message || '', 'chore: release') &&
      !startsWith(github.event.head_commit.message || '', 'chore(main): release')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/modus-bot
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push Bot image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./bot/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Typecheck the dashboard (only if web/** changed) ──────────────────────
  # Gates on the error classes that are runtime faults rather than type-strict
  # nitpicks: an identifier or module the bundle references but cannot resolve
  # throws ReferenceError at setup and renders a blank page. `nuxt build`
  # does NOT catch these — a page whose script crashes still bundles fine, and
  # that is exactly how a broken music dashboard reached production.
  #
  # Deliberately NOT a blocking full typecheck. The project carries ~20
  # pre-existing nullability and inference errors (@nuxt/ui select models,
  # TS2321 recursion limits in Nuxt's route-map types); failing on those would
  # leave CI permanently red and train everyone to ignore it. The full output
  # is still printed, so the backlog stays visible. Once it reaches zero,
  # replace this with a plain `pnpm typecheck`.
  typecheck-web:
    name: Typecheck Web
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # web's postinstall runs `nuxt prepare`, which generates the .nuxt types
      # the typecheck depends on.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: |
          set +e
          pnpm typecheck 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          set -e

          # TS2304  Cannot find name             → ReferenceError
          # TS2552  Cannot find name, did you..  → ReferenceError
          # TS18004 Shorthand with no binding    → ReferenceError
          # TS2307  Cannot find module           → import fails at runtime
          fatal="$(grep -E 'error TS(2304|2552|18004|2307):' typecheck.log || true)"
          total="$(grep -cE 'error TS' typecheck.log || true)"

          if [ -n "$fatal" ]; then
            echo "::error::Unresolved identifiers or modules — these fail at runtime, not just in the typechecker."
            printf '%s\n' "$fatal"
            exit 1
          fi

          # No error lines at all but a non-zero exit means the tool itself
          # failed (missing types, OOM), which must not pass silently.
          if [ "$status" -ne 0 ] && [ "${total:-0}" -eq 0 ]; then
            echo "::error::typecheck did not run to completion (exit ${status})."
            exit 1
          fi

          echo "No runtime-fatal type errors. Pre-existing type errors: ${total:-0}"

  # ── Build Web Image (only if web/** changed, gated on typecheck-web) ──────
  # Excludes automated release commits from Release Please to avoid duplicate
  # container builds, as docker-publish.yml handles release image publishing.
  build-web:
    name: Build Web Image
    needs: [changes, typecheck-web]
    if: >-
      needs.changes.outputs.web == 'true' &&
      needs.typecheck-web.result == 'success' &&
      !startsWith(github.event.head_commit.message || '', 'chore: release') &&
      !startsWith(github.event.head_commit.message || '', 'chore(main): release')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/modus-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
