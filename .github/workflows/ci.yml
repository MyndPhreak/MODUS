# ─────────────────────────────────────────────────────────────────────────────
# MODUS — Continuous Build on Push
#
# Selectively rebuilds only the service(s) that changed:
#   - bot/**  → ghcr.io/<owner>/modus-bot:<branch>        (all branches)
#               ghcr.io/<owner>/modus-bot:latest          (main only)
#   - web/**  → ghcr.io/<owner>/modus-web:<branch>        (all branches)
#               ghcr.io/<owner>/modus-web:latest          (main only)
#
# Also tags every build with :sha-<short-sha>. Can be triggered manually via
# workflow_dispatch. Versioned/tagged images are still produced by
# docker-publish.yml when a release is merged.
# ─────────────────────────────────────────────────────────────────────────────

name: CI — Selective Build & Deploy

on:
  push:
    branches:
      - main
      - "**"
    paths:
      - "bot/**"
      - "web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ── Keep third-party license notice up to date ─────────────────────────────
  check-licenses:
    name: Check Third-Party Licenses
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate third-party licenses
        run: pnpm run licenses:generate

      # Only push-events get an auto-fix commit — this runs on ubuntu-latest,
      # the same platform npm optional deps resolve for in Docker, so unlike
      # a local regenerate on macOS/Windows it can't introduce a platform-drift
      # diff. The commit only touches THIRD_PARTY_LICENSES.md, which isn't in
      # this workflow's path filter, so it can't retrigger this job.
      - name: Auto-commit regenerated licenses
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- THIRD_PARTY_LICENSES.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add THIRD_PARTY_LICENSES.md
            git commit -m "chore: auto-update THIRD_PARTY_LICENSES.md"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Fail if THIRD_PARTY_LICENSES.md is still out of date
        run: |
          if ! git diff --quiet -- THIRD_PARTY_LICENSES.md; then
            echo "::error file=THIRD_PARTY_LICENSES.md::THIRD_PARTY_LICENSES.md is out of date. Run 'pnpm run licenses:generate' and commit the result."
            git diff -- THIRD_PARTY_LICENSES.md
            exit 1
          fi

  # ── Detect which services changed ─────────────────────────────────────────
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      bot: ${{ steps.filter.outputs.bot }}
      web: ${{ steps.filter.outputs.web }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect path changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            shared: &shared
              - "packages/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
            bot:
              - *shared
              - "bot/**"
            web:
              - *shared
              - "web/**"
            migrations:
              - "packages/db/drizzle/**"

  # ── Build Bot Image (only if bot/** changed) ──────────────────────────────
  build-bot:
    name: Build Bot Image
    needs: changes
    if: ${{ needs.changes.outputs.bot == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/modus-bot
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push Bot image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./bot/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build Web Image (only if web/** changed) ──────────────────────────────
  build-web:
    name: Build Web Image
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/modus-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Apply Database Migrations (main only, only if drizzle/** changed) ─────
  # Runs after both images build successfully so a migration never lands
  # ahead of the code that expects it. Additive migrations only, by
  # convention — see docs/migration-runbook.md for the destructive-change
  # process (those still go through a manual pnpm db:migrate).
  migrate-db:
    name: Apply Database Migrations
    needs: [changes, build-bot, build-web]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.migrations == 'true' &&
      needs.changes.result == 'success' &&
      (needs.build-bot.result == 'success' || needs.build-bot.result == 'skipped') &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply pending migrations
        working-directory: packages/db
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
